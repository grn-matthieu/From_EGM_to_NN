# Baseline scalar AR(1) income configuration
# Keeps the model one-dimensional to benchmark solver behaviour before
# introducing high-dimensional CSVAR extensions.
model:
  name: cs

params:
  β: 0.95
  γ: 2.0
  r: 0.03
  y: 1.0

grids:
  Na: 80
  a_min: 0.0
  a_max: 4.0
  type: dense
  dense: null

utility:
  u_type: CRRA

solver:
  method: TimeIteration
  tol: 1.0e-5
  tol_pol: 1.0e-7
  maxit: 10000
  verbose: false
  relax: 0.5
  warm_start: default
  egm:
    interp_kind: linear
  time_iteration:
    interp_kind: linear
  nn:
    epochs: 20000
    batch: 512
    optimizer: adam
    lr: 2.5e-4
    lr_min: 1.0e-5
    lr_max: 5.0e-4
    lr_decay_horizon: 18000
    warmup_epochs: 250
    hid1: 64
    hid2: 64
    samples_per_epoch: 128
    objective: euler_fb_aio
    v_h: 0.75
    w_min: 0.1
    w_max: 5.0
    sigma_shocks: 0.1
    target_loss: 1.0e-6
    use_cuda: false
    n_mc: 32
    resample_every: 5

shocks:
  active: true
  method: tauchen
  ρ_shock: 0.9
  σ_shock: 0.1
  m: 3.0

random:
  seed: 2026
