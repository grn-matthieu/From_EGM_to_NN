# Consolidated deterministic smoke config
# Includes all solver fields so `method: all` can be used safely
model:
  name: cs

params:
  β: 0.96
  γ: 2.0
  r: 0.02
  y: 1.0

grids:
  Na: 50
  a_min: 0.0
  a_max: 20.0
  type: dense
  dense: null

utility:
  u_type: CRRA

solver:
  # run a single method name (string or symbol), a list of names, or use "all"
  # For the deterministic smoke config we keep EGM here to match test expectations.
  method: EGM
  tol: 1.0e-4
  tol_pol: 1.0e-6
  maxit: 10000
  verbose: false
  relax: 0.5
  warm_start: default
  egm:
    interp_kind: linear
  time_iteration:
    interp_kind: linear
  projection:
    orders: [5]
    Nval: 50
    basis_orders: [5]
  perturbation:
    order: 1
    a_bar: null
    h_a: null
    h_z: null
    tol_fit: 1e-8
    maxit_fit: 25
  nn:
    epochs: 200
    batch: 64
    optimizer: adam
    lr: 1e-3
    lr_min: 5.0e-5
    lr_max: 1.0e-3
    lr_decay_horizon: 180
    warmup_epochs: 10
    hid1: 64
    hid2: 64
    samples_per_epoch: 2048
    objective: euler_fb_aio
    v_h: 0.5
    w_min: 0.1
    w_max: 4.0
    sigma_shocks: null
    target_loss: 1.0e-4

shocks:
  # For deterministic smoke config, shocks are disabled but fields are present
  active: false
  method: "rouwenhorst"
  ρ_shock: 0.95
  σ_shock: 0.10
  m: 3.0

random:
  seed: 1234
