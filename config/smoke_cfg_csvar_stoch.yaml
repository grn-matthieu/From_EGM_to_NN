model:
  name: cs_vec

params:
  β: 0.9
  γ: 2.0
  r: 0.02
  y: [0.6, 0.4]
  A:
    - [0.9, 0]
    - [0, 0.9]
  Σ:
    - [0.05, 0.002]
    - [0.002, 0.05]
grids:
  Na: 40
  a_min: 0.0
  a_max: 10.0

utility:
  u_type: CRRA

solver:
  method: NN
  tol: 1.0e-3
  tol_pol: 1.0e-6
  maxit: 5000
  verbose: true
  relax: 0.5
  warm_start: default
  egm:
    interp_kind: linear
  time_iteration:
    interp_kind: linear
  projection:
    orders: [3]
    Nval: 24
  perturbation:
    order: 1
    a_bar: null
    h_a: null
    h_z: null
    tol_fit: 1.0e-8
    maxit_fit: 20
  nn:
    epochs: 5000
    batch: 16
    lr: 1.0e-3
    lr_min: 1.0e-5
    lr_max: 1.0e-3
    lr_decay_horizon: 4500
    warmup_epochs: 100
    hid1: 64
    hid2: 64
    n_mc: 16
    resample_every: 1
    samples_per_epoch: 64
    objective: euler_fb_bcmc
    v_h: 0.5
    w_min: 0.1
    w_max: 10.0
    sigma_shocks: null
    target_loss: 1.0e-4
    use_cuda: false
    bcmc_auto_N: false
    bcmc_budget_T: null
    bcmc_update_every: 10

random:
  seed: 2025
