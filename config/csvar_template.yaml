# High-dimensional CSVAR template configuration
# Provides a correlated multi-component income process for solver experiments.
# Adjust the `A` and `Σ` blocks to explore different persistence/correlation
# structures while keeping the solver options aligned with NN vs. classical
# baselines.
model:
  name: cs_vec

params:
  β: 0.94
  γ: 2.0
  r: 0.025
  y: [0.5, 0.35, 0.1, 0.05]
  A:
    - [0.70, 0.18, 0.05, 0.02]
    - [0.12, 0.68, 0.14, 0.03]
    - [0.08, 0.15, 0.65, 0.12]
    - [0.04, 0.06, 0.18, 0.60]
  Σ:
    - [0.05, 0.020, 0.010, 0.006]
    - [0.020, 0.05, 0.018, 0.008]
    - [0.010, 0.018, 0.05, 0.015]
    - [0.006, 0.008, 0.015, 0.05]

grids:
  Na: 60
  a_min: 0.0
  a_max: 6.0
  type: dense
  dense: null

utility:
  u_type: CRRA

solver:
  method: NN
  tol: 1.0e-4
  tol_pol: 1.0e-6
  maxit: 8000
  verbose: true
  relax: 0.5
  warm_start: default
  egm:
    interp_kind: linear
  time_iteration:
    interp_kind: linear
  nn:
    epochs: 60000
    batch: 256
    optimizer: adamW
    lr: 5.0e-4
    lr_min: 1.0e-5
    lr_max: 1.0e-3
    lr_decay_horizon: 50000
    warmup_epochs: 500
    hid1: 128
    hid2: 128
    samples_per_epoch: 256
    objective: euler_fb_bcmc
    v_h: 0.6
    w_min: 0.1
    w_max: 6.5
    sigma_shocks: null
    target_loss: 5.0e-5
    n_mc: 64
    bcmc_auto_N: true
    bcmc_budget_T: null
    bcmc_update_every: 10
    resample_every: 1

random:
  seed: 2026
